plugins {
    id 'java-gradle-plugin' // so we can assign and ID to our plugin
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.0.0'
    id 'groovy'
    id 'java-library'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '1.2.0'
}

group = 'dev.ultreon'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

javadoc.enabled = false

compileKotlin {
    kotlinOptions.jvmTarget = "17"
}

base {
    archivesName.set('photon')
}

dependencies {
    api 'org.ow2.asm:asm:9.6'
    api 'com.google.code.gson:gson:2.10.1'

    implementation api("gradle.plugin.org.jetbrains.gradle.plugin.idea-ext:gradle-idea-ext:1.1.8"), {
        exclude(group: 'com.google.guava', module: 'guava')
    }

    implementation api("org.jetbrains:annotations:23.0.0")

    implementation gradleApi()
    implementation localGroovy()

    compileOnly api("com.google.guava:guava:33.1.0-jre")
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

gradlePlugin {
    plugins {
        register("dev.ultreon.photon") {
            it.id = "dev.ultreon.photon"
            it.implementationClass = "dev.ultreon.photon.PhotonPlugin"
            it.description = "Gradle plugin for Quantum Voxel mods"
            it.displayName = "Photon Gradle Plugin"
        }
    }

    gradlePlugin.vcsUrl.set("https://gitlab.com/ultreon/photon")
    gradlePlugin.website.set("https://gitlab.com/ultreon/photon")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }


    repositories {
        maven {
            name = "GitLabMaven"
            url = uri("https://gitlab.com/api/v4/projects/59634919/packages/maven")
            credentials(HttpHeaderCredentials) {
                name = "Private-Token"
                value = findProperty("gitLabPrivateToken").toString()
                // the variable resides in $GRADLE_USER_HOME/gradle.properties
            }
            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}
