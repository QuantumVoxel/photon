plugins {
    id 'dev.ultreon.photon' version '0.1.0'
}

if (!production) {
    return
}
photon {
    production = true
    modProject = project

    projectName = "Example Project"
    projectVersion = "0.1.0"
    projectGroup = "com.example"
    projectId = "example-project"
    javaVersion = 21
}

group = 'com.example'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    quantum photon.client("0.1.0-edge.2024.30.4.1")

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}